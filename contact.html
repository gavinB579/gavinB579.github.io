<!DOCTYPE html>
<html lang = "en">
    <head>
      <link rel = "stylesheet" href = "/Styling.css">
      <title>
          Contact
      </title>
    </head>

    <body>  

    <div id="navbar"></div>
    <script src="/assets/navbar/navbarJS.js"></script>

      <section>
        <h1>
          Contact Me
          <p>Feel free to reach out to me with questions or opportunities!</p>
        </h1>
      </section>

      <form id="contactForm" class="contactForm" action="https://formspree.io/f/xbdbpaav" method="POST">

        <section class="formGroup">
          <label for="name">Name:</label><br>
          <input 
            type="text" 
            id="name" 
            name="name"
            placeholder="Your Name"
            required
          >
        </section>

        <section class="formGroup">
          <label for="email">Email:</label><br>
          <input 
            type="email" 
            id="email" 
            name="email"
            placeholder="email@example.com"
            required
          >
        </section>

        <section class="formGroup">
          <label for="message">Message:</label><br>
          <textarea 
            id="message" 
            name="message" 
            rows="4" 
            cols="50" 
            placeholder="Your message here..."
            required
          ></textarea>
        </section>

        <button type="submit">Submit</button>
      </form>

      <p class="privacyNotice"> Your information will only be used to respond to your message. </p>
    </body>

</html>
